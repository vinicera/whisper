name: iOS build (.ipa sem assinatura)

on:
  push:
    branches: [main]
    paths: ["ios/**", "shared/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Versão do Xcode
        run: xcodebuild -version

      - name: Testes do Core (sanitizador + contrato)
        working-directory: ios/Core
        run: swift test

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto
        working-directory: ios
        run: xcodegen generate

      - name: Archive sem assinatura
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Whisper.xcodeproj \
            -scheme Whisper \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Whisper.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning:|ARCHIVE" || true
          test -d "$RUNNER_TEMP/Whisper.xcarchive/Products/Applications/Whisper.app"

      - name: Empacotar .ipa
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p ipa/Payload
          cp -R Whisper.xcarchive/Products/Applications/Whisper.app ipa/Payload/
          cd ipa && zip -qry "Whisper-${{ github.run_number }}.ipa" Payload
          ls -lh *.ipa

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Whisper-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14

      - name: Log do xcodebuild (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: ${{ runner.temp }}/xcodebuild.log
